/* === 星形金色徽章（鏡面 + 微掃光）=== */
/* 可調參數 */
:root{
  --star-size: 68px;              /* 星形大小（寬高） */
  --star-font: 16px;              /* 文字大小（>=16px 可避免 iPhone 放大） */
  --star-rotate: 0deg;            /* 星形微旋轉角度 */
  --star-sweep-sec: 3.6s;         /* 掃光週期 */
}

/* 讓原本的圓角膠囊徽章變成星形徽章 */
.nochip{
  /* 幾何外觀 */
  width: var(--star-size);
  height: var(--star-size);
  padding: 0;                     /* 改為正方形容器，由 clip-path 切星形 */
  border: none !important;
  border-radius: 0;
  position: absolute;             /* 保持原本置中位置 */
  top: 10px;
  left: 50%;
  transform: translateX(-50%) rotate(var(--star-rotate));
  overflow: hidden;

  /* 內容置中 */
  display: flex;
  align-items: center;
  justify-content: center;

  /* 金色鏡面底色 */
  background: linear-gradient(135deg, #fff2a8 0%, #ffd700 30%, #ffb300 55%, #ffdf75 78%, #fff6c9 100%);
  color: #5c3f00 !important;
  font-weight: 900;
  font-size: var(--star-font);
  letter-spacing: 0.5px;
  text-shadow: 0 1px 0 rgba(255,255,255,.6);

  /* 立體與外發光 */
  box-shadow:
    0 0 10px rgba(255, 198, 0, .55),
    0 6px 14px rgba(0,0,0,.22),
    inset 0 0 10px rgba(255,255,255,.65),
    inset 0 -10px 18px rgba(194, 121, 0, .35);

  /* 五角星裁切（正五角星）*/
  /* 參考極座標轉換，適配居中顯示 */
  clip-path: polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 91%,
    50% 70%,
    21% 91%,
    32% 57%,
    2% 35%,
    39% 35%
  );
}

/* 鏡面高光層（固定柔亮） */
.nochip::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(160deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.22) 28%, rgba(255,255,255,0) 60%),
    radial-gradient(120% 90% at 20% 10%, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 65%);
  mix-blend-mode:screen;
  pointer-events:none;
}

/* 掃光層（微掃光） */
.nochip::after{
  content:"";
  position:absolute;
  top:-20%;
  left:-160%;
  width:60%;
  height:140%;
  background: linear-gradient(
    120deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.95) 48%,
    rgba(255,255,255,0) 100%
  );
  transform: skewX(-25deg);
  animation: star-sweep var(--star-sweep-sec) ease-in-out infinite;
  mix-blend-mode:screen;
  pointer-events:none;
}

/* 掃光動畫節奏（前段停留、後段滑過） */
@keyframes star-sweep{
  0%   { left:-160%; opacity:.0; }
  18%  { left:-120%; opacity:.35; }
  45%  { left:115%;  opacity:.9; }
  60%  { left:115%;  opacity:.0; }
  100% { left:115%;  opacity:.0; }
}

/* 小螢幕自動縮小星形，避免壓到標題 */
@media (max-width: 480px){
  :root{
    --star-size: 56px;
    --star-font: 15px;
  }
}


/* === 覆蓋：徽章靠右 + 依進度變色 === */
.nochip{
  right: 12px;
  left: auto;
  transform: rotate(var(--star-rotate));
}

/* <50%：綠色 */
.nochip.low {
  background: linear-gradient(135deg, #d7ffcf, #57d38c, #2ba356);
  color: #0f3d21 !important;
  box-shadow:
    0 0 10px rgba(60, 190, 120, .55),
    0 6px 14px rgba(0,0,0,.22),
    inset 0 0 10px rgba(255,255,255,.55),
    inset 0 -10px 18px rgba(0, 80, 50, .35);
}

/* 50~79%：藍色 */
.nochip.mid {
  background: linear-gradient(135deg, #d6ecff, #5aa8ff, #1c64d1);
  color: #0b243f !important;
  box-shadow:
    0 0 10px rgba(90, 160, 255, .55),
    0 6px 14px rgba(0,0,0,.22),
    inset 0 0 10px rgba(255,255,255,.55),
    inset 0 -10px 18px rgba(0, 60, 160, .35);
}

/* ≥80%：金色（沿用原始星形樣式），此類只作為狀態標記 */
.nochip.high { }


/* === 覆蓋調整：星形徽章置中（取消靠右）＋ 尺寸縮小一半 === */
:root{
  --star-size: 34px;   /* 原 68px 改為 34px */
}

/* 小螢幕再縮一點 */
@media (max-width: 480px){
  :root{ --star-size: 28px; }
}

/* 回到置中（原本模板的 top + left 置中方式） */
.nochip{
  right: auto !important;
  left: 50% !important;
  transform: translateX(-50%) rotate(var(--star-rotate)) !important;
}


/* === 覆蓋：徽章靠右 === */
.nochip{
  left:auto !important;
  right:12px !important;
  transform:rotate(var(--star-rotate)) !important;
}


/* === 徽章放大 1/3 === */
:root{
  --star-size: 55px;
}
@media (max-width: 480px){
  :root{ --star-size: 36px; }
}

}

/* 掃光效果（微光移動） */
.no-num::after{
  content:"";

  left:-150%;

  height:180%;
  background:linear-gradient(
    120deg,
    rgba(255,255,255,0) 0%,

  );

}

@keyframes num-sweep{
  0%   { left:-150%; opacity:0; }
  20%  { left:-120%; opacity:.35; }
  55%  { left:110%;  opacity:.9; }
  70%  { left:110%;  opacity:0; }
  100% { left:110%;  opacity:0; }
}


/* Ensure number badge is visible and large, no leading #, no zero padding */
.no-num{font-size:22px !important;font-weight:900 !important;color:#4a3b00 !important;}


/* === 金屬徽章縮小為 10px === */
.no-num{

/* === C 風格：iPhone 膠囊主按鈕（新增卡片） === */

/* 避免被拉成巨大的圓角塊 */
.toolbar .group{ align-items:center; }

/* === 拖曳排序樣式 === */
.card[draggable="true"]{ cursor: grab; }
.card.dragging{ opacity:.75; transform: scale(.99); cursor: grabbing; }
.grid.drag-active .card:not(.dragging){ transition: transform .12s ease, box-shadow .12s ease; }

<body>
<div class="wrap">
  <h1>Top 50 追番進度條（進階版｜含番號）</h1>
  <div class="toolbar">
    <div class="group">
      <input id="quickNo" type="number" min="1" max="9999" placeholder="番號">
      <button id="btnQuick">快速番號→新增</button>
    </div>
    <div class="group">
      <input id="newTitle" type="text" placeholder="標題（例如：完美世界）">
      <input id="newTotal" type="number" min="1" max="9999" value="100" title="總集數">
      <button id="btnAdd">卡片</button>
    </div>
    <div class="group">
      <select id="sortBy" title="排序">
        <option value="manual">排序：手動（建立順序）</option>
        <option value="progressDesc">排序：進度高→低</option>
        <option value="progressAsc">排序：進度低→高</option>
        <option value="titleAZ">排序：標題 A→Z</option>
        <option value="updatedDesc">排序：最近更新優先</option>
      </select>
      <button id="btnSort">一鍵排序</button>
    </div>
    <div class="group">
      <button id="btnExport">匯出</button>
      <button id="btnImport">匯入</button>
      <input id="fileImport" type="file" accept=".txt,text/plain" style="display:none">
    </div>
    <div class="group hint">滑桿改「已看」，± 改「總集數」，點標題可改名。初始 Top 50 已自動加入「番號」。</div>
    <div id="saveStatus" class="status">已自動儲存</div>
  </div>

  <div id="grid" class="grid"></div>
</div>

<script>
(function(){
  const KEY = 'top50_progress_v2';
  const $ = sel => document.querySelector(sel);
  const grid = $('#grid');

  // ---- Drag & Drop helpers ----
  let dndEnabled = false;
  function enableGridDnd(){
    if(dndEnabled) return;
    dndEnabled = true;

    grid.addEventListener('dragover', (e)=>{
      if(state.sort!=='manual') return;
      e.preventDefault();
      grid.classList.add('drag-active');
      const afterElement = getDragAfterElement(grid, e.clientY);
      const dragging = grid.querySelector('.card.dragging');
      if(!dragging) return;
      if(afterElement==null){
        grid.appendChild(dragging);
      }else{
        grid.insertBefore(dragging, afterElement);
      }
    });

    grid.addEventListener('dragleave', ()=>{
      grid.classList.remove('drag-active');
    });

    grid.addEventListener('drop', ()=>{
      grid.classList.remove('drag-active');
      // 依目前 DOM 順序寫回 order
      const ids = Array.from(grid.querySelectorAll('.card')).map(el=>el.dataset.id);
      ids.forEach((id, i)=>{
        const it = state.items.find(x=>x.id===id);
        if(it) it.order = i;
      });
      scheduleSave();
    });
  }

  function getDragAfterElement(container, y){
    const elements = [...container.querySelectorAll('.card:not(.dragging)')];
    let closest = {offset: Number.POSITIVE_INFINITY, element: null};
    for(const child of elements){
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if(offset < 0 && Math.abs(offset) < closest.offset){
        closest = {offset: Math.abs(offset), element: child};
      }
    }
    return closest.element;
  }


  function fmt(ts){
    const d = new Date(ts||Date.now());
    return new Intl.DateTimeFormat('zh-Hant', {
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit'
    }).format(d);
  }

  const saveStatus = $('#saveStatus');

  // ---- Data layer ----
  function now(){ return Date.now(); }
  function uid(){ return 'id-' + Math.random().toString(36).slice(2,9); }

  // 初始 Top 50（示例：前5為你指定，之後以「作品 N」占位，可自行改名；仍保留番號 1~50）
  const DefaultList = [
    '完美世界','吞噬星空 第二季後半','逆天邪神','凡人修仙傳','拾又之國',
    '作品 6','作品 7','作品 8','作品 9','作品 10',
    '作品 11','作品 12','作品 13','作品 14','作品 15',
    '作品 16','作品 17','作品 18','作品 19','作品 20',
    '作品 21','作品 22','作品 23','作品 24','作品 25',
    '作品 26','作品 27','作品 28','作品 29','作品 30',
    '作品 31','作品 32','作品 33','作品 34','作品 35',
    '作品 36','作品 37','作品 38','作品 39','作品 40',
    '作品 41','作品 42','作品 43','作品 44','作品 45',
    '作品 46','作品 47','作品 48','作品 49','作品 50'
  ];

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ console.warn(e); return null; }
  }

  // 初始化或讀取既有資料
  let state = load();
  if(!state){
    state = {
      items: DefaultList.map((t, i)=>({ id: uid(), title: t, seen:0, total:100, createdAt: now()+i, updatedAt: now()+i, order:i, no: i+1 })),
      sort: 'manual'
    };
    persist();
  }else{
    // 遷移：若舊資料沒有番號，依「手動順序」對前 50 張卡片補番號 1~50（只補沒有 no 的）
    const needNo = state.items.filter(x=>x.no==null).length;
    if(needNo){
      const byOrder = [...state.items].sort((a,b)=>(a.order??0)-(b.order??0));
      let n = 1;
      for(const it of byOrder){
        if(n>50) break;
        if(it.no==null){ it.no = n; n++; }
      }
      // 只更新 updatedAt 不動排序
      const ts = now();
      state.items.forEach(it=>{ if(it.no!=null && !it.updatedAt) it.updatedAt = ts; });
      persist();
    }
  }

  let saveTimer = null;
  function scheduleSave(){
    saveStatus.textContent = '儲存中…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      persist();
      saveStatus.textContent = '已自動儲存';
    }, 300);
  }
  function persist(){
    localStorage.setItem(KEY, JSON.stringify(state));
  }

    switch(state.sort){

      case 'titleAZ'     : return list.sort((a,b)=>a.title.localeCompare(b.title,'zh-Hant'));
      case 'updatedDesc' : return list.sort((a,b)=>b.updatedAt-a.updatedAt);
      case 'manual':
      default: return list.sort((a,b)=>(a.order??0)-(b.order??0));
    }
  }

  // ---- Add / Quick add ----
  function addItem(title, total){
    title = (title||'').trim();
    if(!title){ alert('請輸入標題'); return; }
    total = Math.max(1, Math.min(9999, parseInt(total||'100',10) || 100));
    const it = { id: uid(), title, seen:0, total, createdAt: now(), updatedAt: now(), order: state.items.length };
    state.items.push(it);
    scheduleSave();
    if(state.sort==='manual'){
      grid.appendChild(renderCard(it));
      window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
    }else{
      render();
    }
  }

    $('#newTitle').value=''; $('#newTotal').value=100; $('#newTitle').focus();
  });

    const n = parseInt($('#quickNo').value||'0',10);
    if(!n || n<1){ alert('請輸入正確的番號'); return; }
    addItem('作品 ' + n, $('#newTotal').value);
    $('#quickNo').value='';
  });

  
  // ---- Export / Import ----
  function itemsInDisplayOrder(){
    return sortItems([...state.items]);
  }
  $('#btnExport').addEventListener('click', ()=>{
    const lines = itemsInDisplayOrder().map(it => `${it.title} ${it.seen}/${it.total}`);
    const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    const pad = n=> String(n).padStart(2,'0');
    const d = new Date();
    const name = `top50_progress_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.txt`;
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    URL.revokeObjectURL(a.href);
    a.remove();
  });
  $('#btnImport').addEventListener('click', ()=> $('#fileImport').click());
  $('#fileImport').addEventListener('change', async (e)=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const txt = await f.text();
    const lines = txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    let updated = 0, added = 0;
    const byTitle = new Map(state.items.map(x=>[x.title, x]));
    for(const line of lines){
      const m = line.match(/^(.*)\s+(\d+)\s*\/\s*(\d+)\s*$/);
      if(!m) continue;
      const title = m[1].trim();
      const seen = parseInt(m[2],10);
      const total = parseInt(m[3],10);
      const nowts = now();
      if(byTitle.has(title)){
        const it = byTitle.get(title);
        it.seen = Math.min(Math.max(0, seen), Math.max(1,total));
        it.total = Math.max(1, total);
        it.updatedAt = nowts;
        updated++;
      }else{
        const it = { id: uid(), title, seen: Math.max(0, Math.min(seen,total)), total: Math.max(1,total), createdAt: nowts, updatedAt: nowts, order: state.items.length };

        added++;
      }
